<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#900000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AO3 Offline Reader</title>

  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json" type="application/manifest+json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for EPUB Extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- PDF.js for PDF Extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ao3: {
              red: '#900000',
              redHover: '#700000',
              bgLight: '#f4f4f6',
              tagRel: '#900000',
              tagChar: '#2a6496',
            }
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['Courier New', 'monospace'],
            dyslexic: ['Comic Sans MS', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    .selectable-text { user-select: text; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(144, 0, 0, 0.4); border-radius: 4px; }
    .rating-badge {
      width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 10px; border-radius: 4px; color: white; flex-shrink: 0;
    }
    .rating-G { background-color: #2e7d32; }
    .rating-T { background-color: #e65100; }
    .rating-M { background-color: #c62828; }
    .rating-E { background-color: #880e4f; }
    .rating-NR { background-color: #616161; }

    /* Reader Themes (Light and Sepia) */
    #reader-view.theme-default { background-color: #ffffff; color: #0f172a; }
    #reader-view.theme-sepia { background-color: #fbf0d9; color: #362b1b; }
    #reader-view.theme-sepia a { color: #900000; }

    /* Generous Spacing for Readability */
    .reader-body {
      line-height: 1.8;
      letter-spacing: 0.01em;
    }
    .reader-body p { 
      margin-bottom: 1.5em; 
    }
    .reader-body blockquote {
      border-left: 3px solid #900000; 
      padding-left: 1rem; 
      margin: 1.5em 0; 
      opacity: 0.85; 
      font-style: italic;
    }
  </style>
</head>
<body class="bg-slate-200 text-slate-900 min-h-screen flex justify-center items-center p-0 sm:p-4 font-sans">

    <header id="standard-app-bar" class="bg-ao3-red text-white px-4 py-3 flex items-center justify-between shadow-md shrink-0 z-20">
      <div class="flex items-center space-x-2.5">
        <div class="bg-white text-ao3-red p-1 rounded-md shadow">

          <h1 class="font-serif text-lg font-bold leading-none tracking-wide">AO3 Offline</h1>
          <p class="text-[10px] text-red-200 mt-0.5" id="storage-status-text">IndexedDB: Active</p>
        </div>

      <div class="flex items-center space-x-1">
        <button onclick="toggleSearchBar()" class="p-2 hover:bg-red-800 rounded-full transition text-white">
          <i data-lucide="search" class="w-5 h-5"></i>

        <button onclick="openFilterModal()" class="p-2 hover:bg-red-800 rounded-full transition relative text-white">
          <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>

        </button>
        <button id="pwa-install-btn" onclick="promptPWAInstall()" class="hidden p-2 hover:bg-red-800 rounded-full transition text-yellow-300" title="Install App">

    <div id="storage-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">

          <p>This app uses <strong>IndexedDB</strong> to store full file contents directly inside your device's browser database.</p>

            <div class="flex justify-between"><span>Stored Works:</span> <strong id="stat-works-count">0</strong></div>

  <script>
    const DB_NAME = 'AO3OfflineReaderDB';
    const DB_VERSION = 1;
    const STORE_WORKS = 'works';
    let db = null;
    let loadedWorks = [];
    let activeWork = null;
    let activeChapIndex = 0;
    let deferredPWAInstallPrompt = null;
    let selectionMode = false;
    let selectedWorkIds = new Set();
    let longPressTimer = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_WORKS)) {
            dbInstance.createObjectStore(STORE_WORKS, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(db); };
        request.onerror = (e) => reject(e);
      });
    }

    function saveWorkToDB(work) {
      return new Promise((resolve, reject) => {
        if (!db) return reject("No DB");
        const tx = db.transaction(STORE_WORKS, 'readwrite');
        const store = tx.objectStore(STORE_WORKS);
        store.put(work);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    function fetchWorksFromDB() {
      return new Promise((resolve, reject) => {
        if (!db) return reject("No DB");
        const tx = db.transaction(STORE_WORKS, 'readonly');
        const store = tx.objectStore(STORE_WORKS);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    function deleteWorkFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_WORKS, 'readwrite');
        const store = tx.objectStore(STORE_WORKS);
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function clearDB() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_WORKS, 'readwrite');
        const store = tx.objectStore(STORE_WORKS);
        store.clear();
        tx.oncomplete = () => resolve();
      });
    }

    window.onload = async function() {
      lucide.createIcons();
      registerInlineServiceWorker();
      try {
        await initDB();
        await refreshLibrary();
      } catch(e) { console.error(e); }
    };

    function registerInlineServiceWorker() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl, { scope: './' }).catch(() => {});
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPWAInstallPrompt = e;
        document.getElementById('pwa-install-btn').classList.remove('hidden');
      });
    }

    function promptPWAInstall() {
      if (deferredPWAInstallPrompt) {
        deferredPWAInstallPrompt.prompt();
        deferredPWAInstallPrompt.userChoice.then(() => {
          deferredPWAInstallPrompt = null;
          document.getElementById('pwa-install-btn').classList.add('hidden');
        });
      }
    }

    function handleFileUpload(event) {
      const files = event.target.files;
      if (files && files.length) processFiles(files);
    }

    async function processFiles(files) {
      for (let file of files) {
        if (file.name.endsWith('.epub')) {
          await parseAndStoreEPUB(file);
        } else if (file.name.endsWith('.pdf')) {
          await parseAndStorePDF(file);
        }
      }
      await refreshLibrary();
    }

    async function parseAndStorePDF(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdfDoc = await loadingTask.promise;
        
        let title = file.name.replace('.pdf', '');
        let author = "PDF Document";
        let summary = "<p>Imported PDF Document.</p>";
        let chapters = [];
        let totalWords = 0;

        const pageSize = 5;
        let currentChapterText = "";
        let chapterCount = 1;

        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          
          totalWords += pageText.trim().split(/\s+/).filter(Boolean).length;
          currentChapterText += `<p>${escapeHTML(pageText)}</p>`;

          if (i % pageSize === 0 || i === pdfDoc.numPages) {
            chapters.push({
              title: `Part ${chapterCount}`,
              content: currentChapterText
            });
            currentChapterText = "";
            chapterCount++;
          }
        }

        const workRecord = {
          id: 'work-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
          title: title,
          author: author,
          rating: 'General Audiences',
          fandoms: ['PDF Document'],
          relationships: [],
          characters: [],
          tags: ['PDF'],
          summary: summary,
          words: totalWords,
          chaptersCount: chapters.length || 1,
          isComplete: true,
          dateAdded: new Date().toISOString(),
          lastReadChapter: 0,
          chapters: chapters.length ? chapters : [{ title: 'Document', content: '<p>Empty PDF.</p>' }]
        };

        await saveWorkToDB(workRecord);
      } catch (e) {
        console.error("PDF parse error", e);
      }
    }

    async function parseAndStoreEPUB(file) {
      try {
        const zip = await JSZip.loadAsync(file);
        let title = file.name.replace('.epub', '');
        let author = "Unknown Author";
        let summary = "";
        let rating = "General Audiences";
        let fandoms = [], relationships = [], characters = [], tags = [], chapters = [];
        let totalWords = 0;

        const htmlFiles = [];
        zip.forEach((path, entry) => {
          if (!entry.isDirectory && (path.endsWith('.html') || path.endsWith('.xhtml') || path.endsWith('.htm'))) { htmlFiles.push(path); }
        });
        htmlFiles.sort();

        for (let i = 0; i < htmlFiles.length; i++) {
          const contentText = await zip.file(htmlFiles[i]).async('text');
          const parser = new DOMParser();
          const doc = parser.parseFromString(contentText, 'text/html');

          if (i === 0 || contentText.includes('Fandom:') || contentText.includes('Rating:') || contentText.includes('Summary')) {
            const getMetaValue = (label) => {
              const elements = Array.from(doc.querySelectorAll('dt, b, strong, span, p, th'));
              for (let el of elements) {
                if (el.textContent && el.textContent.toLowerCase().includes(label.toLowerCase())) {
                  let sibling = el.nextElementSibling || (el.parentElement ? el.parentElement.nextElementSibling : null);
                  if (sibling && sibling.textContent.trim()) {
                    return sibling.textContent.trim();
                  }
                  let parentText = el.parentElement ? el.parentElement.textContent.trim() : '';
                  if (parentText.length > label.length) {
                    return parentText.replace(new RegExp(label, 'i'), '').trim();
                  }
                }
              }
              return null;
            };

            const extractedTitle = doc.querySelector('h1.title') || doc.querySelector('h1');
            if (extractedTitle && extractedTitle.textContent.trim()) {
              title = extractedTitle.textContent.trim();
            }

            const extractedAuthor = getMetaValue('Author:') || getMetaValue('by');
            if (extractedAuthor) author = extractedAuthor.replace(/^by\s+/i, '');

            rating = getMetaValue('Rating:') || rating;
            
            const f = getMetaValue('Fandom:'); 
            if (f) fandoms = f.split(',').map(s => s.trim()).filter(Boolean);

            const r = getMetaValue('Relationship:') || getMetaValue('Relationships:'); 
            if (r) relationships = r.split(',').map(s => s.trim()).filter(Boolean);

            const c = getMetaValue('Char:') || getMetaValue('Characters:'); 
            if (c) characters = c.split(',').map(s => s.trim()).filter(Boolean);

            const t = getMetaValue('Tags:'); 
            if (t) tags = t.split(',').map(s => s.trim()).filter(Boolean);

            const sumNode = doc.querySelector('.summary blockquote') || 
                            doc.querySelector('blockquote.summary') || 
                            doc.querySelector('.summary') || 
                            doc.querySelector('.userstuff blockquote') || 
                            doc.querySelector('blockquote');
            if (sumNode && sumNode.innerHTML.trim()) {
              summary = sumNode.innerHTML.trim();
            }
          }

          if (doc.body) {
            const rawText = doc.body.textContent || '';
            totalWords += rawText.trim().split(/\s+/).filter(Boolean).length;
            let cTitle = `Chapter ${chapters.length + 1}`;
            const header = doc.querySelector('h1, h2, h3');
            if (header && header.textContent.trim() && header.textContent.length < 60) {
              cTitle = header.textContent.trim();
            }
            
            // Skip storing the raw metadata/summary intro page as a narrative chapter if it repeats chapter 1 info
            const isMetaIntroPage = (i === 0 && (contentText.includes('Summary') || contentText.includes('Fandom:')) && htmlFiles.length > 1);
            if (!isMetaIntroPage) {
              chapters.push({ title: cTitle, content: doc.body.innerHTML });
            }
          }
        }

        const workRecord = {
          id: 'work-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
          title: title || file.name.replace('.epub', ''),
          author: author || 'Unknown Author',
          rating: rating || 'General Audiences',
          fandoms: fandoms.length ? fandoms : ['General Fandom'],
          relationships: relationships || [],
          characters: characters || [],
          tags: tags || [],
          summary: summary || '<p>No summary provided.</p>',
          words: totalWords || 0,
          chaptersCount: chapters.length || 1,
          isComplete: true,
          dateAdded: new Date().toISOString(),
          lastReadChapter: 0,
          chapters: chapters.length ? chapters : [{ title: 'Work', content: '<p>Empty work.</p>' }]
        };

        await saveWorkToDB(workRecord);
      } catch (e) { console.error("EPUB parse error", e); }
    }

    async function refreshLibrary() {
      loadedWorks = await fetchWorksFromDB();
      renderLibraryUI();
    }

    function renderLibraryUI() {
      const container = document.getElementById('fic-card-container');
      const filtered = getFilteredWorks();

      document.getElementById('work-count-text').textContent = loadedWorks.length;
      document.getElementById('stat-works-count').textContent = loadedWorks.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl p-6 text-center border border-slate-200 mt-2">
            <i data-lucide="book-open" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
            <p class="text-xs text-slate-500 font-semibold">Your library is empty. Tap the red (+) button to add files.</p>
          </div>`;
        lucide.createIcons();
        return;
      }
      container.innerHTML = filtered.map(work => createFicCardHTML(work)).join('');
      lucide.createIcons();
    }

    function getFilteredWorks() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const sortVal = document.getElementById('sort-selector').value;
      const minW = parseInt(document.getElementById('min-words-input').value) || 0;
      const maxW = parseInt(document.getElementById('max-words-input').value) || Infinity;
      const checkedRatings = Array.from(document.querySelectorAll('.filter-rating-cb:checked')).map(cb => cb.value);
      const completion = document.querySelector('input[name="completion-filter"]:checked').value;

      return loadedWorks.filter(w => {
        if (query) {
          const inTitle = w.title.toLowerCase().includes(query);
          const inAuthor = w.author.toLowerCase().includes(query);
          const inFandom = w.fandoms.some(f => f.toLowerCase().includes(query));
          const inRel = w.relationships.some(r => r.toLowerCase().includes(query));
          const inTag = w.tags.some(t => t.toLowerCase().includes(query));
          if (!inTitle && !inAuthor && !inFandom && !inRel && !inTag) return false;
        }
        if (checkedRatings.length > 0 && !checkedRatings.includes(w.rating)) return false;
        if (completion === 'complete' && !w.isComplete) return false;
        if (completion === 'wip' && w.isComplete) return false;
        if (w.words < minW || w.words > maxW) return false;
        return true;
      }).sort((a, b) => {
        if (sortVal === 'dateAdded-desc') return new Date(b.dateAdded) - new Date(a.dateAdded);
        if (sortVal === 'wordCount-desc') return b.words - a.words;
        if (sortVal === 'wordCount-asc') return a.words - b.words;
        if (sortVal === 'title-asc') return a.title.localeCompare(b.title);
        if (sortVal === 'author-asc') return a.author.localeCompare(b.author);
        return 0;
      });
    }

    function createFicCardHTML(work) {
      let rClass = 'rating-NR', rLabel = 'NR';
      const ratingStr = work.rating || '';
      if (ratingStr.includes('General')) { rClass = 'rating-G'; rLabel = 'G'; }
      else if (ratingStr.includes('Teen')) { rClass = 'rating-T'; rLabel = 'T'; }
      else if (ratingStr.includes('Mature')) { rClass = 'rating-M'; rLabel = 'M'; }
      else if (ratingStr.includes('Explicit')) { rClass = 'rating-E'; rLabel = 'E'; }

      const isSelected = selectedWorkIds.has(work.id);

      return `
        <article id="card-${work.id}" 
          onmousedown="startLongPress('${work.id}')" onmouseup="cancelLongPress()" mouseleave="cancelLongPress()"
          ontouchstart="startLongPress('${work.id}')" ontouchend="cancelLongPress()"
          onclick="handleCardClick(event, '${work.id}')"
          class="bg-white rounded-xl border ${isSelected ? 'border-ao3-red bg-red-50/30' : 'border-slate-200'} shadow-sm p-3.5 space-y-2.5 relative transition duration-150 cursor-pointer">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start gap-2.5">
              ${selectionMode ? `
                <div class="mt-0.5 w-5 h-5 rounded border flex items-center justify-center ${isSelected ? 'bg-ao3-red border-ao3-red text-white' : 'border-slate-300 bg-white'}">
                  ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                </div>
              ` : `<span class="rating-badge ${rClass} mt-0.5">${rLabel}</span>`}
              <div>
                <h3 class="font-serif font-bold text-sm text-ao3-red leading-snug">${escapeHTML(work.title)}</h3>
                <p class="text-[11px] text-slate-500 font-medium">by ${escapeHTML(work.author)}</p>
              </div>
            </div>
            ${!selectionMode ? `
              <div class="flex gap-1">
                <button onclick="event.stopPropagation(); openReader('${work.id}')" class="px-2.5 py-1 bg-ao3-red text-white text-xs font-semibold rounded-lg shadow-sm">Read</button>
              </div>
            ` : ''}
          </div>

          <div class="text-[11px] text-slate-700 pt-1 border-t border-slate-100">
            <span class="text-slate-400 font-medium">Fandom:</span> <strong class="text-slate-800">${work.fandoms.join(', ')}</strong>
          </div>

          ${(work.relationships && work.relationships.length > 0) ? `
            <div class="text-[11px] text-slate-700">
              <span class="text-slate-400 font-medium">Pairing:</span> <strong class="text-ao3-tagRel">${work.relationships.join(', ')}</strong>
            </div>
          ` : ''}

          ${(work.tags && work.tags.length > 0) ? `
            <div class="flex flex-wrap gap-1.5 text-[10px] pt-0.5">
              ${work.tags.map(t => `<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${escapeHTML(t)}</span>`).join('')}
            </div>
          ` : ''}

          <div class="bg-slate-50 border-l-2 border-ao3-red p-2.5 rounded-r text-[11px] text-slate-600 italic line-clamp-3">${work.summary}</div>
          
          <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1.5 border-t border-slate-100">
            <span>${(work.words || 0).toLocaleString()} words • ${work.chaptersCount} chap</span>
            <span>Progress: Chap ${work.lastReadChapter + 1}</span>
          </div>
        </article>
      `;
    }

    function startLongPress(id) {
      cancelLongPress();
      longPressTimer = setTimeout(() => { enterSelectionMode(id); }, 500);
    }
    function cancelLongPress() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }
    function enterSelectionMode(initialId) {
      selectionMode = true; selectedWorkIds.clear();
      if (initialId) selectedWorkIds.add(initialId);
      document.getElementById('standard-app-bar').classList.add('hidden');
      document.getElementById('selection-app-bar').classList.remove('hidden');
      updateSelectionUI();
    }
    function exitSelectionMode() {
      selectionMode = false; selectedWorkIds.clear();
      document.getElementById('selection-app-bar').classList.add('hidden');
      document.getElementById('standard-app-bar').classList.remove('hidden');
      renderLibraryUI();
    }
    function handleCardClick(event, id) {
      if (selectionMode) { event.stopPropagation(); toggleSelectWork(id); }
      else { openReader(id); }
    }
    function toggleSelectWork(id) {
      if (selectedWorkIds.has(id)) { selectedWorkIds.delete(id); }
      else { selectedWorkIds.add(id); }
      if (selectedWorkIds.size === 0) exitSelectionMode();
      else updateSelectionUI();
    }
    function toggleSelectAll() {
      const currentFiltered = getFilteredWorks();
      if (selectedWorkIds.size === currentFiltered.length) { selectedWorkIds.clear(); }
      else { currentFiltered.forEach(w => selectedWorkIds.add(w.id)); }
      updateSelectionUI();
    }
    function updateSelectionUI() {
      document.getElementById('selected-count-text').textContent = `${selectedWorkIds.size} selected`;
      const currentFiltered = getFilteredWorks();
      const allSelected = currentFiltered.length > 0 && selectedWorkIds.size === currentFiltered.length;
      document.getElementById('select-all-btn').textContent = allSelected ? 'Deselect All' : 'Select All';
      renderLibraryUI();
    }
    async function deleteSelectedWorks() {
      if (selectedWorkIds.size === 0) return;
      if (confirm(`Permanently delete ${selectedWorkIds.size} selected story file(s) from device storage?`)) {
        for (let id of selectedWorkIds) { await deleteWorkFromDB(id); }
        exitSelectionMode();
        await refreshLibrary();
      }
    }
    async function clearIndexedDB() {
      if (confirm("Permanently remove all local files?")) {
        await clearDB();
        await refreshLibrary();
        closeStorageModal();
      }
    }

    function openReader(workId) {
      activeWork = loadedWorks.find(w => w.id === workId);
      if (!activeWork) return;
      activeChapIndex = activeWork.lastReadChapter || 0;
      document.getElementById('reader-top-title').textContent = activeWork.title;
      document.getElementById('reader-title').textContent = activeWork.title;
      document.getElementById('reader-author').textContent = `by ${activeWork.author}`;
      
      // Enclosed Chapter Metadata Box with Summary included properly
      document.getElementById('reader-tags-box').innerHTML = `
        <div class="flex flex-wrap gap-1.5 items-center">
          <span class="font-bold text-slate-500">Rating:</span> <span class="bg-slate-200 px-1.5 py-0.5 rounded text-[10px]">${activeWork.rating}</span>
          <span class="font-bold text-slate-500 ml-2">Fandom:</span> <span>${activeWork.fandoms.join(', ')}</span>
        </div>
        ${activeWork.relationships && activeWork.relationships.length ? `
          <div class="flex flex-wrap gap-1 items-center">
            <span class="font-bold text-slate-500">Pairing:</span> <strong class="text-ao3-tagRel">${activeWork.relationships.join(', ')}</strong>
          </div>
        ` : ''}
        ${activeWork.tags && activeWork.tags.length ? `
          <div class="flex flex-wrap gap-1 pt-1">
            ${activeWork.tags.map(t => `<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px] border border-slate-200">${escapeHTML(t)}</span>`).join('')}
          </div>
        ` : ''}
      `;
      document.getElementById('reader-summary-box').innerHTML = `<strong class="text-slate-700">Summary:</strong> ${activeWork.summary}`;
      
      const drop = document.getElementById('reader-chapter-dropdown');
      drop.innerHTML = activeWork.chapters.map((c, i) => `<option value="${i}">${c.title || `Chapter ${i+1}`}</option>`).join('');
      renderChapterBody();
      document.getElementById('reader-view').classList.remove('hidden');
    }

    function closeReaderView() {
      document.getElementById('reader-view').classList.add('hidden');
      activeWork = null;
    }

    async function renderChapterBody() {
      if (!activeWork || !activeWork.chapters[activeChapIndex]) return;
      const chap = activeWork.chapters[activeChapIndex];
      document.getElementById('reader-chapter-dropdown').value = activeChapIndex;
      document.getElementById('btn-prev-chap').disabled = (activeChapIndex === 0);
      document.getElementById('btn-next-chap').disabled = (activeChapIndex === activeWork.chapters.length - 1);
      document.getElementById('btn-bottom-prev').disabled = (activeChapIndex === 0);
      document.getElementById('btn-bottom-next').disabled = (activeChapIndex === activeWork.chapters.length - 1);
      document.getElementById('reader-content-body').innerHTML = chap.content;
      document.getElementById('reader-view').scrollTo({ top: 0, behavior: 'smooth' });
      activeWork.lastReadChapter = activeChapIndex;
      await saveWorkToDB(activeWork);
    }

    function navigateChapter(dir) {
      const target = activeChapIndex + dir;
      if (target >= 0 && target < activeWork.chapters.length) {
        activeChapIndex = target;
        renderChapterBody();
      }
    }
    function onChapterSelect(val) { activeChapIndex = parseInt(val); renderChapterBody(); }
    function toggleSearchBar() { document.getElementById('search-panel').classList.toggle('hidden'); }
    function clearSearch() { document.getElementById('search-input').value = ''; applyFilters(); }
    function toggleReaderSettings() { document.getElementById('reader-settings-panel').classList.toggle('hidden'); }
    
    function setReaderTheme(theme) {
      const rv = document.getElementById('reader-view');
      rv.className = rv.className.replace(/theme-\w+/g, '');
      rv.classList.add(`theme-${theme}`);
    }
    function setReaderFont(fontClass) {
      const b = document.getElementById('reader-content-body');
      b.className = b.className.replace(/font-\w+/g, '');
      b.classList.add(fontClass);
    }
    function setReaderFontSize(sz) {
      document.getElementById('reader-content-body').style.fontSize = `${sz}px`;
      document.getElementById('font-size-label').textContent = `${sz}px`;
    }
    function openFilterModal() { document.getElementById('filter-modal').classList.remove('hidden'); }
    function closeFilterModal() { document.getElementById('filter-modal').classList.add('hidden'); }
    function openStorageModal() { document.getElementById('storage-modal').classList.remove('hidden'); }
    function closeStorageModal() { document.getElementById('storage-modal').classList.add('hidden'); }
    function applyFilters() { renderLibraryUI(); }
    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('min-words-input').value = '';
      document.getElementById('max-words-input').value = '';
      document.querySelectorAll('.filter-rating-cb').forEach(c => c.checked = false);
      document.querySelector('input[name="completion-filter"][value="all"]').checked = true;
      renderLibraryUI();
    }
    function escapeHTML(s) {
      return s ? s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','&#39;':'&#39;','"':'&quot;'}[c])) : '';
    }
  </script>
</body>
</html>
